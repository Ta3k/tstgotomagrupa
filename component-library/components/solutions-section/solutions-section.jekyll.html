<!-- begin solutions -->
{% if include.show_solutions != false %}
<section id="solutions" class="c-solutions">
  <div class="container">
    <div class="c-home-head c-solutions__head" data-reveal>
      <h2 class="c-home-head__title">{{ site.data[page.lang].projects.item82 }}</h2>
      <p class="c-home-head__lead">{{ site.data[page.lang].projects.item83 }}</p>
    </div>

    {% assign solutions = site.data[page.lang].projects.solutions %}
    <div class="c-solutions__grid" data-reveal-group>
      {% for solution in solutions %}
        <div class="c-solution">
          <span class="c-solution__media"><img loading="lazy" decoding="async" src="{{ solution.image | relative_url }}" alt="{{ solution.alt | escape }}"></span>
          <span class="c-solution__title">{{ solution.title }}</span>
          <span class="c-solution__text">{{ solution.description }}</span>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
<!-- end solutions -->
