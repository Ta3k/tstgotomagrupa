<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% if page.url == "/" %}{{ site.data.general_settings.title }}{% elsif page.title %}{{ page.title }}{% else %}{{ site.data.general_settings.title }}{% endif %}</title>
  <meta name='description' content='{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.data.general_settings.description }}{% endif %}'>

  <link rel="canonical" href="{% if page.url == "/" %}{{ site.data.general_settings.url }}/{% else %}{{ site.data.general_settings.url }}{{ page.url | replace:'index.html','' }}{% endif %}">
  {% if page.translation_url %}
  <link rel="alternate" hreflang="{{ page.lang }}" href="{{ site.data.general_settings.url }}{{ page.url }}">
  <link rel="alternate" hreflang="{% if page.lang == 'pl' %}en{% else %}pl{% endif %}" href="{{ site.data.general_settings.url }}{{ page.translation_url }}">
  {% endif %}

  <!-- Twitter Card -->
  <!-- <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.url == "/" %}{{ site.data.general_settings.title }}{% else %}{{ page.title }} – {{ site.data.general_settings.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.url == "/" %}{{ site.data.general_settings.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta name="twitter:image:src" content="{% if page.url == "/" %}{{ site.data.general_settings.social_media_share_image | absolute_url }}{% else %}{{ page.image | absolute_url }}{% endif %}"> -->

  <!-- Facebook OpenGraph -->
  <!-- <meta property="og:title" content="{% if page.url == "/" %}{{ site.data.general_settings.title }}{% else %}{{ page.title }} – {{ site.data.general_settings.title }}{% endif %}">
  <meta property="og:description" content="{% if page.url == "/" %}{{ site.data.general_settings.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta property="og:image" content="{% if page.url == "/" %}{{ site.data.general_settings.social_media_share_image | absolute_url }}{% else %}{{ page.image | absolute_url }}{% endif %}"> -->

  <!-- The hero font is same-origin, optional, and preloaded without a connection chain. -->
  <link rel="preload" href="/assets/fonts/poppins-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  {% if page.lang == "pl" %}
    <link rel="preload" href="/assets/fonts/poppins-600-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  {% endif %}

  {% if page.layout == "post" or page.layout == "project" %}
    <script defer type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script defer nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  {% endif %}

  <link rel="preload" as="style" href="/assets/cookiedialog.min.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/assets/cookiedialog.min.css"></noscript>
  <script defer src="/js/vendor/cookiedialog-1.0.3.min.js"></script>
  <link rel="stylesheet" href="/assets/main.css">
</head>
